[workspace]
resolver = "2"
members = [
    "crates/vault-protocol",
    "crates/vault-core",
    "crates/vault-service",
    "crates/vault-transport",
    "crates/simdrive",
    "tools/vault-cli",
    "tools/sim-e2e",
]
exclude = ["passport-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
lightning-invoice = "0.33"
foundation-ur = "0.4"
minicbor = { version = "0.24", default-features = false }

[profile.release]
opt-level = "s"
strip = false

[profile.dev.package."*"]
opt-level = 2
